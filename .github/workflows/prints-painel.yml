name: Prints do painel
# Captura as telas do painel com dados fictícios, para revisão visual no PR:
# desktop e três iPhones (375x812, 390x844, 430x932), claro e escuro.
# Não publica imagem nem faz deploy; nenhum segredo é usado.
#
# Era "Prints do Hub Social" e cobria só aquela área. A varredura mobile
# (docs/auditoria-mobile-ios.md) precisa ver o painel inteiro, e os dois
# aparelhos das pontas que a auditoria pede nunca foram capturados.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/lib/navegacao.ts"
      - "scripts/prints/**"
      - ".github/workflows/prints-painel.yml"
      # `next.config.ts` decide o que entra no bundle standalone, e é esse
      # bundle que serve as capturas. Quando o rastreamento deixou o
      # libvips do sharp para trás, quem descobriu foi este job.
      - "next.config.ts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55433/cliente_portal_test?schema=public
      APP_JWT_SECRET: prints-somente-ci
      APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Subir banco descartável
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Criar papel exigido pelas migrações
        run: docker compose -f docker-compose.test.yml exec -T db-test psql -U postgres -d cliente_portal_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='app_avila') THEN CREATE ROLE app_avila; END IF; END \$\$;"
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Dados fictícios
        run: npx tsx scripts/prints/semear.ts
      - name: Build
        run: npx next build
      # Dois segundos aqui contra cinco minutos de captura: sem esta sonda, um
      # binário nativo que não carrega só aparece como uma tela em 500 no fim
      # do job, com a causa enterrada no log do app.
      - name: Conferir o sharp no bundle
        run: node scripts/prints/conferir-sharp.mjs
      # `next.config.ts` usa output: "standalone", e o Next avisa no próprio log
      # que `next start` não funciona com isso: serve a página mas devolve 404
      # em parte dos chunks, e a árvore some na hidratação. Print silenciosamente
      # errado é pior que print ausente, então o app sobe pelo server.js do
      # bundle, com os estáticos copiados para dentro dele.
      - name: Subir o app
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          node .next/standalone/server.js > next.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:3000/login --timeout 120000
        env:
          HOSTNAME: 127.0.0.1
          PORT: "3000"
      - name: Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Capturar
        run: node scripts/prints/capturar.mjs
      - name: Log do app
        if: always()
        run: tail -n 200 next.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-painel
          path: prints/
          retention-days: 14

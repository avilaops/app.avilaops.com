name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Validar lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55433/cliente_portal_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      # O projeto passou de 2 GB de heap no `tsc` e o runner derrubava o job
      # com "JavaScript heap out of memory" — exit 134, sem nenhum erro de
      # tipo na saída, o que faz o job parecer uma reprovação de tipagem.
      # 6 GB cabe folgado no runner de 16 GB e dá margem para o projeto crescer.
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Subir banco descartável
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Criar papel exigido pelas migrações
        # A migração 20260904190000_add_estudio_module faz ALTER TABLE ...
        # OWNER TO app_avila, que existe em produção mas não neste banco
        # descartável. Sem isto, toda migração após 04/09 falha aqui — o
        # build e o deploy ficam pulados (skipped) em silêncio, e ninguém
        # percebe porque o job aparece só como "failure", não "deploy quebrado".
        run: docker compose -f docker-compose.test.yml exec -T db-test psql -U postgres -d cliente_portal_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='app_avila') THEN CREATE ROLE app_avila; END IF; END \$\$;"
      - name: Aplicar migrações no banco de teste
        run: npx prisma migrate deploy
      # Banco recém-migrado e `schema.prisma` precisam descrever a mesma coisa.
      # Se divergirem, o próximo `prisma migrate dev` gera uma migração que
      # apaga o que só existe no SQL (índices de busca, coluna gerada).
      - name: Conferir migrações contra o schema.prisma
        run: npm run db:drift
      - name: Executar suíte completa
        run: npm test
      - name: Derrubar banco de teste
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
  # Construcao e implantacao moram aqui, e nao em `uses: avilaops/infra/...`:
  # este repositorio e publico e o avilaops/infra e privado, e o GitHub nao
  # deixa repositorio publico chamar workflow reutilizavel de repositorio
  # privado: o run termina em falha de inicializacao sem executar nada. Foi o
  # que derrubou todo push daqui ate 08/10/2026.
  #
  # Os dois jobs abaixo sao copia de avilaops/infra
  # (`.github/workflows/container.yml` e `deploy-ssh.yml`), com as mesmas
  # actions fixadas por SHA. Mudou la, traga para ca.
  #
  # `image` depende de `verify` para que teste vermelho barre a publicacao da
  # imagem e, por tabela, o deploy.
  image:
    name: image / build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Pull request constroi e valida; so o push na main publica a imagem.
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    outputs:
      image: ${{ steps.result.outputs.image }}
    steps:
      - name: Obter codigo do commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar publicacao
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" != pull_request* ]]
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          fi
          printf 'IMAGE_NAME=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Preparar Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Autenticar no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e validar imagem
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: Identificar imagem publicada
        if: env.PUBLISH == 'true'
        id: result
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: image
    # So a main, so por push ou disparo manual, e so com o deploy ligado na
    # variavel do repositorio. Pull request, inclusive de fork (o repositorio e
    # publico), nunca chega aqui nem ve os segredos.
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production-app.avilaops.com
      cancel-in-progress: false
    steps:
      - name: Enviar imagem ao servidor
        env:
          APPLICATION: app.avilaops.com
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PORT: 22
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/avilaops/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT > 0 && DEPLOY_PORT < 65536 ))
          temporary_ssh=$(mktemp -d)
          trap 'rm -rf "$temporary_ssh"' EXIT
          chmod 700 "$temporary_ssh"
          printf '%s\n' "$SSH_KEY" > "$temporary_ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$temporary_ssh/known_hosts"
          chmod 600 "$temporary_ssh/key" "$temporary_ssh/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -i "$temporary_ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$temporary_ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $APPLICATION $IMAGE"

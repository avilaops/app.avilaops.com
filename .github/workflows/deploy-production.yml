name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Validar lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55433/cliente_portal_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Subir banco descartável
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Criar papel exigido pelas migrações
        # A migração 20260904190000_add_estudio_module faz ALTER TABLE ...
        # OWNER TO app_avila, que existe em produção mas não neste banco
        # descartável. Sem isto, toda migração após 04/09 falha aqui — o
        # build e o deploy ficam pulados (skipped) em silêncio, e ninguém
        # percebe porque o job aparece só como "failure", não "deploy quebrado".
        run: docker compose -f docker-compose.test.yml exec -T db-test psql -U postgres -d cliente_portal_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='app_avila') THEN CREATE ROLE app_avila; END IF; END \$\$;"
      - name: Aplicar migrações no banco de teste
        run: npx prisma migrate deploy
      - name: Executar suíte completa
        run: npm test
      - name: Derrubar banco de teste
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra/.github/workflows/container.yml@5e560f44062c8e025ddcfd86197e5394b562deae
    with:
      publish: ${{ github.event_name != 'pull_request' }}
  deploy:
    permissions:
      contents: read
      packages: read
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    uses: avilaops/infra/.github/workflows/deploy-ssh.yml@5e560f44062c8e025ddcfd86197e5394b562deae
    with:
      application: app.avilaops.com
      image: ${{ needs.image.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

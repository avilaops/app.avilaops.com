services:
  app:
    build:
      context: .
      # Carimbo de versão: vem do ambiente de quem roda o build. O padrão é
      # "desconhecido" — build feito à mão diz que não sabe, em vez de mentir
      # o commit anterior.
      args:
        GIT_SHA: ${GIT_SHA:-desconhecido}
        BUILT_AT: ${BUILT_AT:-desconhecido}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
